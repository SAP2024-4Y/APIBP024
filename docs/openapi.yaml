openapi: '3.1.0'
info:
  title: TicketSphere Events & Ticketing API
  version: '1.0.0'
  description: |
    # TicketSphere API

    Production-grade REST API for Events & Ticketing. Browse events, book tickets,
    explore venues on a map, and manage your bookings — all through a consistent,
    cursor-paginated REST interface.

    ---

    ## Quick-Start Flow

    ```
    1. POST /api/v1/auth/token     →  obtain a Bearer token
    2. GET  /api/v1/events         →  browse published events  (no token needed)
    3. GET  /api/v1/events/{id}    →  view event details       (no token needed)
    4. POST /api/v1/tickets        →  book a ticket            (token required)
    5. GET  /api/v1/tickets        →  view your bookings       (token required)
    6. DELETE /api/v1/tickets/{id} →  cancel a booking         (token required)
    ```

    ---

    ## Roles & Permissions

    | Role | Allowed actions |
    |---|---|
    | **Public** (no token) | Browse events, venues, categories; map & calendar search |
    | **Attendee** | + Book tickets, view own tickets, cancel own tickets |
    | **Organizer** | + Create events and venues, update own events |
    | **Admin** | Everything — cancel any event, delete venues, view all tickets |

    Set the token using the **Authorize** button (top-right) with the format: `Bearer <token>`

    ---

    ## Authentication

    Protected endpoints require a `Bearer` JWT in the `Authorization` header:

    ```
    Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    ```

    Tokens expire after **24 hours** (`expires_in: 86400`). Re-authenticate to get a fresh token.

    ---

    ## Pagination

    List endpoints use **cursor-based keyset pagination** for consistent performance at scale:

    ```
    # First page
    GET /api/v1/events?limit=10

    # Next page — use next_cursor from the previous response
    GET /api/v1/events?limit=10&after=eyJmaWVsZCI6InN0YXJ0c19hdCJ9
    ```

    Every paginated response includes:
    ```json
    {
      "pagination": {
        "limit": 10,
        "has_more": true,
        "next_cursor": "eyJmaWVsZCI6InN0YXJ0c19hdCIsInZhbHVlIjoiMjAyNi0xMi0xMFQyMDowMDowMFoiLCJpZCI6ImFiYzEyMyJ9"
      }
    }
    ```

    - `has_more: true` → more pages exist; pass `next_cursor` as `after` to fetch the next page
    - `has_more: false` → this is the last page; `next_cursor` will be `null`

    ---

    ## Rate Limiting

    | Scope | Limit |
    |---|---|
    | General API (`/api/v1/*`, `/graphql`) | **200 requests / 15 minutes** per IP |
    | Auth (`POST /api/v1/auth/token`) | **20 requests / 15 minutes** per IP |

    Every response includes these headers:
    - `RateLimit-Limit` — maximum requests allowed in the window
    - `RateLimit-Remaining` — requests remaining before throttling
    - `RateLimit-Reset` — Unix timestamp when the window resets

    Exceeding the limit returns `429 RATE_LIMITED`.

    ---

    ## Demo Credentials

    | Username | Password | Role |
    |---|---|---|
    | `admin` | `admin-secret-2026` | Admin |
    | `demo` | `demo-password` | Attendee |
    | `eventco` | `demo-password` | Organizer |
    | `livemusic` | `demo-password` | Organizer |

    ---

    ## Error Format

    All errors follow a consistent envelope:

    ```json
    {
      "error": {
        "code": "EVENT_NOT_FOUND",
        "message": "Event not found."
      }
    }
    ```

    Use the `code` field for programmatic error handling. See individual endpoints for all possible codes.

    ---

    ## Prices & Currency

    All price fields (`min_price`, `max_price`, `price`) are in **Indian Rupees (INR)** per
    [ISO 4217](https://www.iso.org/iso-4217-currency-codes.html). Free events have
    both `min_price: 0` and `max_price: 0`.

    ---

    ## Date & Time

    All datetime fields use **ISO 8601 UTC** format: `YYYY-MM-DDTHH:MM:SSZ`

    Example: `2026-12-15T18:30:00Z` (always include hours, minutes, seconds, and the `Z` timezone suffix).

    Times are stored and returned in UTC. Convert to local time on the client using
    the browser's `Intl.DateTimeFormat` API.

  contact:
    name: Team APIBP024
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: |
      Obtain and manage Bearer JWT tokens.

      **Actors:** Any user (public, attendee, organizer, admin)
  - name: Events
    description: |
      Browse, search, create, and manage events.

      **List API** — cursor-paginated event listing with filters and sorting.
      **Map API** — geospatial proximity and bounding-box search.
      **Calendar API** — time-window overlap search.
  - name: Venues
    description: |
      Manage event venues with geographic coordinates.

      Venues are referenced by events. Each venue has a GeoJSON `location` for map rendering and proximity search.
  - name: Tickets
    description: |
      Book and manage tickets for events.

      **Actors:** Authenticated users (attendee, organizer, admin)
  - name: Categories
    description: |
      Reference list of event categories used for filtering and display.

paths:
  # ── Health ────────────────────────────────────────────────────────────────
  /health:
    get:
      summary: Service health check
      operationId: getHealth
      security: []
      tags: [Auth]
      description: |
        Returns `200 OK` when the service is running and ready to handle requests.

        **Actor:** Monitoring tools, load balancers, CI pipelines
        **Use-case:** Infrastructure check → verify the service is alive before routing traffic
        **Role required:** None (public)

        Used by Docker healthcheck and CI smoke tests.
      responses:
        '200':
          description: Service is healthy and ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: ticketsphere-api
                timestamp: '2026-11-22T10:30:00Z'

  # ── Auth ──────────────────────────────────────────────────────────────────
  /api/v1/auth/token:
    post:
      summary: Obtain a Bearer JWT token
      operationId: login
      security: []
      tags: [Auth]
      description: |
        Authenticates a user and returns a JWT Bearer token.

        **Actor:** Any registered user (attendee, organizer, admin)
        **Use-case:** User enters credentials → receives token → uses token for protected endpoints
        **Role required:** None (public — but credentials must be valid)

        The token expires after **24 hours**. Store it securely and re-authenticate when it expires.

        **Rate limit:** 20 requests per 15 minutes per IP to prevent brute-force attacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              attendee:
                summary: Attendee login
                value:
                  username: demo
                  password: demo-password
              admin:
                summary: Admin login
                value:
                  username: admin
                  password: admin-secret-2026
              organizer:
                summary: Organizer login
                value:
                  username: eventco
                  password: demo-password
      responses:
        '200':
          description: Authentication successful — token returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c2VyLTEyMyIsInVzZXJuYW1lIjoiZGVtbyIsInJvbGUiOiJhdHRlbmRlZSIsImlhdCI6MTc2NDAwMDAwMCwiZXhwIjoxNzY0MDg2NDAwfQ.signature
                token_type: Bearer
                expires_in: 86400
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error:
                  code: AUTH_INVALID_CREDENTIALS
                  message: Invalid username or password.
        '422':
          description: Request body is missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed.
                  details:
                    - path: [username]
                      message: Required
        '429':
          description: Too many login attempts — wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error:
                  code: RATE_LIMITED
                  message: Too many authentication attempts. Please try again later.

  # ── Events — List ─────────────────────────────────────────────────────────
  /api/v1/events:
    get:
      summary: List events
      operationId: listEvents
      security: []
      tags: [Events]
      description: |
        Returns a cursor-paginated list of events with optional filtering and sorting.

        **Actor:** Anyone — website visitors, mobile app, dashboard
        **Use-case:** User opens the Events page → browses published events with optional filters
        **Role required:** None (public)

        Results default to `created_at asc`. Use `sort` and `order` to change ordering.
        Use `after` (the `next_cursor` from the previous response) to page through results.

        **Filter combinations:** All filters are AND-ed together.
        Example: `?status=published&category=music&max_price=500` returns published music events under ₹500.
      parameters:
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/category'
        - $ref: '#/components/parameters/min_price'
        - $ref: '#/components/parameters/max_price'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/after'
      responses:
        '200':
          description: Paginated list of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
              example:
                data:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    title: Coldplay Music of the Spheres World Tour
                    description: Coldplay brings their spectacular world tour to Mumbai.
                    status: published
                    category: music
                    min_price: 1500.00
                    max_price: 15000.00
                    venue:
                      id: ven-001
                      name: DY Patil Stadium
                      address: Sector 7, Nerul
                      city: Mumbai
                      country: IN
                      location:
                        type: Point
                        coordinates: [73.0169, 19.0450]
                      capacity: 55000
                      created_at: '2026-01-01T00:00:00Z'
                    starts_at: '2026-12-20T19:00:00Z'
                    ends_at: '2026-12-20T23:00:00Z'
                    total_seats: 55000
                    available_seats: 12000
                    organizer_id: usr-org-001
                    created_at: '2026-10-01T09:00:00Z'
                    updated_at: '2026-10-15T12:00:00Z'
                pagination:
                  limit: 20
                  has_more: true
                  next_cursor: eyJmaWVsZCI6ImNyZWF0ZWRfYXQiLCJ2YWx1ZSI6IjIwMjYtMTAtMDFUMDk6MDA6MDBaIiwiaWQiOiIzZmE4NWY2NCJ9
        '422':
          description: Invalid filter or pagination parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed.
                  details:
                    - path: [min_price]
                      message: Expected number, received string
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      summary: Create a new event
      operationId: createEvent
      tags: [Events]
      description: |
        Creates a new event at an existing venue.

        **Actor:** Organizer or Admin
        **Use-case:** Organizer logs in → fills event form → submits → event appears in listing
        **Role required:** Any authenticated user (`attendee`, `organizer`, or `admin`)

        The authenticated user becomes the `organizer_id`. `available_seats` is automatically
        set to `total_seats` on creation.

        **Validation rules:**
        - `ends_at` must be after `starts_at`
        - `venue_id` must reference an existing venue
        - `max_price` should be ≥ `min_price`
        - For free events: set both `min_price` and `max_price` to `0`
        - Prices are in INR (ISO 4217: INR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              title: Pune Tech Summit 2026
              description: Annual technology conference covering AI, cloud, and open-source innovation.
              category: conference
              status: published
              min_price: 0
              max_price: 999.00
              venue_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              starts_at: '2026-12-15T10:00:00Z'
              ends_at: '2026-12-15T18:00:00Z'
              total_seats: 500
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleEventResponse'
              example:
                data:
                  id: abc12345-5717-4562-b3fc-2c963f66afa7
                  title: Pune Tech Summit 2026
                  description: Annual technology conference covering AI, cloud, and open-source innovation.
                  status: published
                  category: conference
                  min_price: 0
                  max_price: 999.00
                  venue:
                    id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    name: Phoenix Marketcity Arena
                    address: Nagar Road, Viman Nagar
                    city: Pune
                    country: IN
                    location:
                      type: Point
                      coordinates: [73.9197, 18.5641]
                    capacity: 2000
                    created_at: '2026-01-01T00:00:00Z'
                  starts_at: '2026-12-15T10:00:00Z'
                  ends_at: '2026-12-15T18:00:00Z'
                  total_seats: 500
                  available_seats: 500
                  organizer_id: usr-org-001
                  created_at: '2026-11-22T08:00:00Z'
                  updated_at: '2026-11-22T08:00:00Z'
        '401':
          description: No token provided or token expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                missing_token:
                  summary: No Authorization header
                  value:
                    error:
                      code: AUTH_REQUIRED
                      message: Authentication required.
                expired_token:
                  summary: Token expired or malformed
                  value:
                    error:
                      code: AUTH_INVALID_TOKEN
                      message: Token is invalid or has expired.
        '404':
          description: The specified venue_id does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error:
                  code: VENUE_NOT_FOUND
                  message: Venue not found.
        '422':
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                missing_fields:
                  summary: Required field missing
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Request validation failed.
                      details:
                        - path: [title]
                          message: Required
                ends_before_starts:
                  summary: ends_at before starts_at
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: ends_at must be after starts_at
        '429':
          $ref: '#/components/responses/RateLimited'

  # ── Events — Map: Proximity ───────────────────────────────────────────────
  /api/v1/events/nearby:
    get:
      summary: Find events near a point (Map API — proximity search)
      operationId: nearbyEvents
      security: []
      tags: [Events]
      description: |
        Returns all events whose venue is within `radius_km` kilometres of the given coordinates,
        ordered by distance (nearest first).

        **Actor:** App user viewing the map
        **Use-case:** User opens the map → browser provides current location → map renders all nearby event pins
        **Role required:** None (public)

        **Getting the user's current location (browser):**
        ```javascript
        navigator.geolocation.getCurrentPosition(pos => {
          const { latitude, longitude } = pos.coords;
          fetch(`/api/v1/events/nearby?latitude=${latitude}&longitude=${longitude}&radius_km=25`);
        });
        ```

        **Coordinate convention:** GeoJSON `coordinates` are returned as `[longitude, latitude]` —
        note that longitude comes first (this is the GeoJSON standard, opposite of what many APIs use).

        Returns all matching events within the radius. An empty area returns `data: []`, not a 404.
        Distance is calculated using the Haversine formula (accurate to ~0.3%).
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
            example: 19.0760
          description: Centre-point latitude in decimal degrees (−90 to +90). North is positive.
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
            example: 72.8777
          description: Centre-point longitude in decimal degrees (−180 to +180). East is positive.
        - name: radius_km
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: 0.1
            maximum: 500
            example: 25
          description: Search radius in kilometres (0.1–500). Use 25–50 km for city-level searches.
      responses:
        '200':
          description: Events within the radius, ordered nearest-first. Empty array if no events found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyEventsResponse'
              example:
                data:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    title: Coldplay Music of the Spheres World Tour
                    category: music
                    min_price: 1500.00
                    max_price: 15000.00
                    starts_at: '2026-12-20T19:00:00Z'
                    ends_at: '2026-12-20T23:00:00Z'
                    available_seats: 12000
                    distance_km: 4.2
                    venue:
                      id: ven-001
                      name: DY Patil Stadium
                      city: Mumbai
                      country: IN
                      location:
                        type: Point
                        coordinates: [73.0169, 19.0450]
                      capacity: 55000
                      created_at: '2026-01-01T00:00:00Z'
                total: 1
        '422':
          description: Missing or invalid coordinate/radius parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                missing_params:
                  summary: Required parameters missing
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: latitude, longitude, and radius_km are required numbers.
                radius_too_large:
                  summary: radius_km exceeds 500
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Request validation failed.
        '429':
          $ref: '#/components/responses/RateLimited'

  # ── Events — Map: Bounding Box ────────────────────────────────────────────
  /api/v1/events/bbox:
    get:
      summary: Find events inside a geographic bounding box (Map API)
      operationId: bboxEvents
      security: []
      tags: [Events]
      description: |
        Returns all events whose venue falls within the specified geographic bounding box (rectangle).

        **Actor:** App user panning or zooming the map
        **Use-case:** User moves the map viewport → app sends the visible bounds → map renders all pins within view
        **Role required:** None (public)

        **Getting the viewport bounds (Leaflet example):**
        ```javascript
        const bounds = map.getBounds();
        fetch(`/api/v1/events/bbox?min_lat=${bounds.getSouth()}&min_lon=${bounds.getWest()}&max_lat=${bounds.getNorth()}&max_lon=${bounds.getEast()}`);
        ```

        Returns all matching events in the box, ordered by start date. An empty viewport returns `data: []`, not a 404.
      parameters:
        - name: min_lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
            example: 18.89
          description: South-west corner latitude (minimum latitude of the bounding box)
        - name: min_lon
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
            example: 72.77
          description: South-west corner longitude (minimum longitude of the bounding box)
        - name: max_lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
            example: 19.28
          description: North-east corner latitude (maximum latitude of the bounding box)
        - name: max_lon
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
            example: 73.08
          description: North-east corner longitude (maximum longitude of the bounding box)
      responses:
        '200':
          description: Events inside the bounding box, ordered by start date. Empty array if none found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListSimpleResponse'
              example:
                data:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    title: Coldplay Music of the Spheres World Tour
                    category: music
                    min_price: 1500.00
                    max_price: 15000.00
                    starts_at: '2026-12-20T19:00:00Z'
                    ends_at: '2026-12-20T23:00:00Z'
                    available_seats: 12000
                    venue:
                      id: ven-001
                      name: DY Patil Stadium
                      city: Mumbai
                      country: IN
                      location:
                        type: Point
                        coordinates: [73.0169, 19.0450]
                      capacity: 55000
                      created_at: '2026-01-01T00:00:00Z'
                total: 1
        '422':
          description: Missing or invalid bounding box parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Request validation failed.
        '429':
          $ref: '#/components/responses/RateLimited'

  # ── Events — Calendar ─────────────────────────────────────────────────────
  /api/v1/events/schedule:
    get:
      summary: List events overlapping a time window (Calendar API)
      operationId: scheduleEvents
      security: []
      tags: [Events]
      description: |
        Returns all events that overlap the specified time window, ordered by start date.

        **Actor:** App user viewing the calendar
        **Use-case:** User navigates to a month → app fetches all events in that month → calendar renders them on correct dates
        **Role required:** None (public)

        **Overlap logic:** An event overlaps the window if it starts before the window end AND ends after
        the window start. For example, an event at 20:00–23:00 IS returned for a window of 18:00–21:00.

        **Calendar month example:**
        ```
        starts_at=2026-12-01T00:00:00Z&ends_at=2026-12-31T23:59:59Z
        ```

        Results are paginated — use `after` for windows with many events.
      parameters:
        - name: starts_at
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2026-12-01T00:00:00Z'
          description: Window start — ISO 8601 UTC datetime (e.g. `2026-12-01T00:00:00Z`). Events ending after this are included.
        - name: ends_at
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: '2026-12-31T23:59:59Z'
          description: Window end — ISO 8601 UTC datetime. Must be after `starts_at`. Events starting before this are included.
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/category'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/after'
      responses:
        '200':
          description: Events overlapping the time window, ordered by start date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
              example:
                data:
                  - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    title: Coldplay Music of the Spheres World Tour
                    category: music
                    min_price: 1500.00
                    max_price: 15000.00
                    starts_at: '2026-12-20T19:00:00Z'
                    ends_at: '2026-12-20T23:00:00Z'
                    available_seats: 12000
                    venue:
                      id: ven-001
                      name: DY Patil Stadium
                      city: Mumbai
                      country: IN
                      location:
                        type: Point
                        coordinates: [73.0169, 19.0450]
                      capacity: 55000
                      created_at: '2026-01-01T00:00:00Z'
                window:
                  starts_at: '2026-12-01T00:00:00Z'
                  ends_at: '2026-12-31T23:59:59Z'
                pagination:
                  limit: 50
                  has_more: false
                  next_cursor: null
        '422':
          description: Invalid datetime parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                invalid_format:
                  summary: Date not ISO 8601
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Request validation failed.
                ends_before_starts:
                  summary: ends_at is before starts_at
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: ends_at must be after starts_at
        '429':
          $ref: '#/components/responses/RateLimited'

  # ── Events — Single ───────────────────────────────────────────────────────
  /api/v1/events/{id}:
    get:
      summary: Get a single event by ID
      operationId: getEvent
      security: []
      tags: [Events]
      description: |
        Returns the full details of a single event including the embedded venue object.

        **Actor:** Anyone — event detail page, ticket purchase flow
        **Use-case:** User clicks an event card → app fetches full details → shows description, venue map, pricing, seat availability
        **Role required:** None (public)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleEventResponse'
              example:
                data:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  title: Coldplay Music of the Spheres World Tour
                  description: Coldplay brings their spectacular world tour to Mumbai for two unforgettable nights.
                  status: published
                  category: music
                  min_price: 1500.00
                  max_price: 15000.00
                  venue:
                    id: ven-001
                    name: DY Patil Stadium
                    address: Sector 7, Nerul
                    city: Mumbai
                    country: IN
                    location:
                      type: Point
                      coordinates: [73.0169, 19.0450]
                    capacity: 55000
                    created_at: '2026-01-01T00:00:00Z'
                  starts_at: '2026-12-20T19:00:00Z'
                  ends_at: '2026-12-20T23:00:00Z'
                  total_seats: 55000
                  available_seats: 12000
                  organizer_id: usr-org-001
                  created_at: '2026-10-01T09:00:00Z'
                  updated_at: '2026-10-15T12:00:00Z'
        '404':
          description: No event with the given ID exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error:
                  code: EVENT_NOT_FOUND
                  message: Event not found.
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      summary: Update an event
      operationId: updateEvent
      tags: [Events]
      description: |
        Updates one or more fields of an existing event. All fields are optional — send only what you want to change.

        **Actor:** The event's organizer or an Admin
        **Use-case:** Organizer edits event details → updates title, description, pricing, or reschedules the event
        **Role required:** `organizer` (own events only) or `admin` (any event)

        Attempting to edit another organizer's event returns `403 FORBIDDEN`.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
            example:
              title: Coldplay Music of the Spheres — Night 2
              max_price: 18000.00
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleEventResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                missing_token:
                  value:
                    error:
                      code: AUTH_REQUIRED
                      message: Authentication required.
                expired_token:
                  value:
                    error:
                      code: AUTH_INVALID_TOKEN
                      message: Token is invalid or has expired.
        '403':
          description: Authenticated but not the event owner or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error:
                  code: FORBIDDEN
                  message: You do not have permission to perform this action.
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error:
                  code: EVENT_NOT_FOUND
                  message: Event not found.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      summary: Cancel an event (sets status to cancelled)
      operationId: cancelEvent
      tags: [Events]
      description: |
        Cancels an event by setting its `status` to `cancelled`. This is a **soft delete** — the event
        record is preserved but marked as cancelled. Cancelled events cannot be booked.

        **Actor:** The event's organizer or an Admin
        **Use-case:** Organizer cancels an event → attendees can no longer book tickets
        **Role required:** `organizer` (own events only) or `admin` (any event)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Event cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: cancelled
              example:
                data:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  status: cancelled
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error:
                  code: AUTH_REQUIRED
                  message: Authentication required.
        '403':
          description: Not the event owner or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error:
                  code: FORBIDDEN
                  message: You do not have permission to perform this action.
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              example:
                error:
                  code: EVENT_NOT_FOUND
                  message: Event not found.
        '429':
          $ref: '#/components/responses/RateLimited'

  # ── Venues ────────────────────────────────────────────────────────────────
