                    name: DY Patil Stadium
                    address: Sector 7, Nerul
                    city: Mumbai
                    country: IN
                    location:
                      type: Point
                      coordinates: [73.0169, 19.0450]
                    capacity: 55000
                    created_at: '2026-01-01T00:00:00Z'
                total: 12
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      summary: Create a new venue
      operationId: createVenue
      tags: [Venues]
      description: |
        Creates a new venue with a geographic location.

        **Actor:** Organizer or Admin
        **Use-case:** Organizer wants to host an event at a new venue → first registers the venue → then creates the event
        **Role required:** Any authenticated user

        `country` must be an ISO 3166-1 alpha-2 code (e.g. `IN` for India, `US` for United States).
        `latitude` and `longitude` are used for map rendering and proximity search.
